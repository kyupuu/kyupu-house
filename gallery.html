<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>画廊「きゅぷぅ」 | きゅぷぅのおうち</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="site-title">きゅぷぅのおうち</h1>
    <nav>
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="game.html">ゲーム制作日記</a></li>
        <li><a href="gallery.html" class="active">画廊「きゅぷぅ」</a></li>
        <li><a href="tools.html">ごみツール集</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>🎨 画廊「きゅぷぅ」へようこそ</h2>
      <p>館長きゅぷぅが描き上げたオリジナルイラストやファンアートなどを展示する由緒正しきギャラリーです。画像をタップすると大きく拡大して見られるぞ！</p>
    </section>

    <section class="card">
      <h2>展示作品</h2>
      
      <!-- 1枚目の展示枠 -->
      <div style="text-align: center; margin-top: 15px;">
        <img src="きゅぷぅのおうち画像/作品1.png" class="zoomable-img" alt="イラスト作品1" style="max-width: 100%; height: auto;">
        <p style="margin-top: 8px; font-weight: bold;">記念すべき第1作目！転スラより、"リムル・テンペスト"</p>
      </div>
      
      <div style="text-align: center; margin-top: 15px;">
        <img src="きゅぷぅのおうち画像/TJWY6596.PNG" class="zoomable-img" alt="イラスト作品2" style="max-width: 100%; height: auto;">
        <p style="margin-top: 8px; font-weight: bold;">第2作目！ポケットモンスターブラック・ホワイトより、"ベル"</p>
      </div>

      <!-- 2枚目以降を追加したいときは、上の <div ...>...</div> をコピーして下に貼ればOK！ -->

    </section>
  </main>

  <footer>
    <p>&copy; 2026 きゅぷぅのおうち</p>
  </footer>

  <!-- 画像拡大用モーダル -->
  <div id="image-modal" onclick="closeModal()">
    <img id="modal-img">
  </div>
  <script>
    function openModal(src) {
      document.getElementById("image-modal").style.display = "flex";
      document.getElementById("modal-img").src = src;
    }
    function closeModal() {
      document.getElementById("image-modal").style.display = "none";
    }
    document.addEventListener("click", function(e) {
      if (e.target.classList.contains("zoomable-img")) {
        openModal(e.target.src);
      }
    });
  </script>
</body>
</html>
